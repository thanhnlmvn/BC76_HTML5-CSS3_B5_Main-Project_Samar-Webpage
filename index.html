<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon" />
    <title>Samar - HTML Template</title>

    <!-- Roboto font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Flaticon CSS -->
    <link rel="stylesheet" href="./css/flaticon/flaticon.css" />

    <!-- Line Awesome CSS CDN -->
    <link
      rel="stylesheet"
      href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css"
    />

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="container">
        <div class="header__content">
          <a href="#">
            <img src="./img/logo-2.png" alt="" />
          </a>
          <nav>
            <ul>
              <li>
                <a href="#">
                  <span>Home</span>
                  <i class="fa-solid fa-angle-down"></i>
                </a>
              </li>
              <li>
                <a href="#">
                  <span>Pages</span>
                  <i class="fa-solid fa-angle-down"></i>
                </a>
              </li>
              <li>
                <a href="#">
                  <span>Services</span>
                  <i class="fa-solid fa-angle-down"></i>
                </a>
              </li>
              <li>
                <a href="#">
                  <span>Post Layout</span>
                  <i class="fa-solid fa-angle-down"></i>
                </a>
              </li>
              <li>
                <a href="#">
                  <span>Blog</span>
                  <i class="fa-solid fa-angle-down"></i>
                </a>
              </li>
              <li>
                <a href="#">
                  <span>Contact Us</span>
                  <i class="fa-solid fa-angle-down"></i>
                </a>
              </li>
            </ul>
            <div class="header__button">
              <button class="button">Get a Quote</button>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <!-- BANNER -->
      <section class="banner">
        <div class="container">
          <div class="banner__content">
            <div class="banner__left">
              <h4>We are The Best</h4>
              <h2 class="title">Freelance Product Designer Running</h2>
              <p>
                We develop the relationships that underpin the next phase in
                your
                <br />
                organisation’s growth.
              </p>
              <ul>
                <li>
                  <i class="las la-check"></i> Master's degree in designing
                </li>
                <li><i class="las la-check"></i> Outstanding mobile design</li>
              </ul>
              <button class="button">get started</button>
            </div>
            <div class="banner__right">
              <img src="./img/pic3_1.png" alt="banner" />
            </div>
          </div>
        </div>
      </section>

      <!-- SERVICES -->
      <section class="services"></section>

      <!-- ABOUT -->
      <section class="about"></section>

      <!-- NUMBER -->
      <section class="number"></section>

      <!-- FEATURES -->
      <section class="features"></section>

      <!-- PORTFOLIO -->
      <section class="portfolio"></section>

      <!-- BLOG -->
      <section class="blog"></section>
    </main>

    <!-- FOOTER -->
    <footer></footer>
    <!-- Fontawesome CDN -->
    <script
      src="https://kit.fontawesome.com/1d52c6c7e0.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
